
<!DOCTYPE html>

                    <p class="text-[11px] font-black text-slate-400 uppercase tracking-[0.2em] mt-1">Texas</p>

            <div class="flex flex-wrap gap-2 mb-10">

                Enter Node

            <div class="flex items-center gap-6 mb-10">
                <div class="w-16 h-16 bg-slate-900 rounded-2xl shadow-lg flex items-center justify-center text-white font-black text-2xl">A</div>
                <div>
                    <h3 class="font-black text-slate-900 text-xl leading-tight">Accountant</h3>

                <span class="px-4 py-1.5 bg-slate-50 text-[10px] font-black text-slate-400 rounded-xl uppercase">Audit Node</span>

            </div>
        </a>
        
        </div>
    </div>
    <script>
        document.getElementById('searchInput').oninput = (e) => {
            const t = e.target.value.toLowerCase();
            document.querySelectorAll('.card').forEach(c => {
                c.style.display = c.dataset.s.toLowerCase().includes(t) ? 'block' : 'none';
            });
        };
    </script>
</body>
</html>
