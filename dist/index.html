    <script>
        document.getElementById('searchInput').oninput = (e) => {
            const t = e.target.value.toLowerCase();
            document.querySelectorAll('.card').forEach(c => {
                c.style.display = c.dataset.s.toLowerCase().includes(t) ? 'block' : 'none';
            });
        };
    </script>
