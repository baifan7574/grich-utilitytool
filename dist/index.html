<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GRICH Audit - Michael Expert System Directory</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-50 min-h-screen p-8 font-sans">
    <div class="max-w-4xl mx-auto">
        <header class="mb-10 text-center">
            <h1 class="text-4xl font-black text-slate-900 mb-2">GRICH Audit System</h1>
            <p class="text-slate-500 font-medium">Michael V5.1 Live System</p>
        </header>

        <div class="bg-white rounded-3xl shadow-xl p-8 border border-slate-100">
            <input type="text" id="search" placeholder="Search profession or state..."
                class="w-full mb-6 px-6 py-4 rounded-xl border border-slate-200 bg-slate-50 text-lg"
                onkeyup="filterList()">
            <div class="space-y-2 h-[600px] overflow-y-auto pr-2" id="link-list"></div>
        </div>
    </div>

    <script>
        const container = document.getElementById('link-list');
        const actions = ['compress-pdf', 'encrypt-pdf', 'merge-pdf', 'ocr-pdf', 'split-pdf', 'word-to-pdf'];
        const professions = ['accountant', 'detective', 'doctor', 'financial-advisor', 'government-official', 'hr-manager', 'journalist', 'lawyer', 'psychologist', 'r-d-scientist'];
        const states = ['california', 'florida', 'georgia', 'illinois', 'new-york', 'north-carolina', 'ohio', 'pennsylvania', 'texas'];

        let allLinks = [];
        actions.forEach(action => {
            professions.forEach(prof => {
                states.forEach(state => {
                    allLinks.push(`${action}-${prof}-${state}.html`);
                });
            });
        });

        function renderList(items) {
            container.innerHTML = items.map(f => `
                <a href="${f}" class="block p-4 rounded-xl hover:bg-indigo-50 border border-transparent hover:border-indigo-100 transition-all">
                    <span class="font-medium text-slate-700">${f.replace('.html', '').toUpperCase()}</span>
                </a>
            `).join('');
        }

        renderList(allLinks);

        function filterList() {
            const query = document.getElementById('search').value.toLowerCase();
            renderList(allLinks.filter(l => l.includes(query)));
        }
    </script>
</body>

</html>
