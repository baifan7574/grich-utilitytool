name: Traffic Sentry - Daily Indexer

on:
  schedule:
    # Daily at 00:00 UTC.
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  indexing-job:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: scenro-daily-indexing
      cancel-in-progress: false

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install google-api-python-client google-auth requests

      - name: Run Indexer Script
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          PYTHONIOENCODING: utf-8
        run: |
          python .agent/skills/traffic-sentry/scripts/daily_indexer.py

      - name: Run GSC Status Report
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          PYTHONIOENCODING: utf-8
        run: |
          python .agent/skills/traffic-sentry/scripts/gsc_status_check.py

      - name: Commit & Push Log Updates
        run: |
          git config --global user.name "Traffic Sentry Bot"
          git config --global user.email "bot@scenro.com"
          git fetch origin main
          git add -f indexed_progress.log gsc_daily_stats.json
          if git diff --cached --quiet; then
            echo "No log changes to commit"
            exit 0
          fi
          git commit -m "chore: update indexing progress [skip ci]"
          git pull --rebase origin main
          git push
